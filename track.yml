name: Rastreador de vuelos BOG→BAQ

on:
  schedule:
    # Cada hora entre 6AM y 11PM (hora Colombia = UTC-5)
    # En UTC: 11:00 a 04:00 del día siguiente
    - cron: "0 11-23,0-4 * * *"
  workflow_dispatch:   # Permite ejecutar manualmente desde GitHub

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar rastreador
        env:
          SERPAPI_KEY:             ${{ secrets.SERPAPI_KEY }}
          TWILIO_ACCOUNT_SID:      ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:       ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM:    ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO:      ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: python tracker.py

      - name: Guardar historial de precios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: price-history-${{ github.run_number }}
          path: price_history.csv
          retention-days: 90
